# ATMOS GitLab CI
#
# Scope:
# - main
# - feat/*
# - merge requests targeting the project
#
# Deployment is intentionally not enabled yet. The pipeline validates quality,
# tests, coverage and build artifacts so Azure deployment can be added later
# without changing the quality gates.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/.+$/'
    - when: never

stages:
  - validate
  - test
  - build
  - package

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  BACKEND_REPORT_DIR: "$CI_PROJECT_DIR/reports/quality/backend"
  FRONTEND_REPORT_DIR: "$CI_PROJECT_DIR/reports/quality/frontend"

.rules_main_feat_mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/.+$/'

.cache_pip:
  cache:
    key:
      files:
        - apps/backend/pyproject.toml
      prefix: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/

.cache_npm:
  cache:
    key:
      files:
        - package-lock.json
        - apps/frontend/package.json
      prefix: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/npm/

.backend_base:
  image: python:3.11-slim
  extends:
    - .cache_pip
    - .rules_main_feat_mr
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e "apps/backend[dev]"
    - mkdir -p "$BACKEND_REPORT_DIR"

.frontend_base:
  image: node:20-alpine
  extends:
    - .cache_npm
    - .rules_main_feat_mr
  before_script:
    - npm ci --prefer-offline
    - mkdir -p "$FRONTEND_REPORT_DIR"

backend:ruff:
  stage: validate
  extends: .backend_base
  script:
    - cd apps/backend
    - set +e
    - ruff check app tests --output-format json --output-file "$BACKEND_REPORT_DIR/ruff.json"
    - RUFF_EXIT=$?
    - set -e
    - python ../../infra/quality/ruff_html_report.py "$BACKEND_REPORT_DIR/ruff.json" "$BACKEND_REPORT_DIR/ruff.html" --project-name "ATMOS backend"
    - ruff check app tests
    - exit $RUFF_EXIT
  artifacts:
    when: always
    paths:
      - reports/quality/backend/ruff.json
      - reports/quality/backend/ruff.html
    expire_in: 14 days

backend:pylint:
  stage: validate
  extends: .backend_base
  script:
    - cd apps/backend
    - python -m pylint app tests --output-format="json:$BACKEND_REPORT_DIR/pylint.json" --reports=y --score=y --exit-zero
    - python ../../infra/quality/pylint_html_report.py "$BACKEND_REPORT_DIR/pylint.json" "$BACKEND_REPORT_DIR/pylint.html" --project-name "ATMOS backend"
    - python -m pylint app tests --persistent=n --reports=n --score=y --fail-under=9.5
  artifacts:
    when: always
    paths:
      - reports/quality/backend/pylint.json
      - reports/quality/backend/pylint.html
    expire_in: 14 days

frontend:eslint:
  stage: validate
  extends: .frontend_base
  script:
    - npm run lint:frontend
    - npm exec --workspace @atmos/frontend -- eslint "src/**/*.{ts,tsx}" --format html --output-file "$FRONTEND_REPORT_DIR/eslint.html"
  artifacts:
    when: always
    paths:
      - reports/quality/frontend/eslint.html
    expire_in: 14 days

frontend:typecheck:
  stage: validate
  extends: .frontend_base
  script:
    - npm run typecheck:frontend

backend:test:
  stage: test
  extends: .backend_base
  variables:
    SECRET_KEY: "ci-only-not-for-production"
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    REFRESH_TOKEN_EXPIRE_DAYS: "14"
    PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: "30"
    AUTO_INIT_DB_ON_STARTUP: "false"
    WORKSPACE_STORAGE_DIR: "$CI_PROJECT_DIR/.tmp/workspaces"
    ETL_STORAGE_DIR: "$CI_PROJECT_DIR/.tmp/etl"
    PYTEST_ADDOPTS: "--basetemp=$CI_PROJECT_DIR/.tmp/pytest"
  script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp/workspaces" "$CI_PROJECT_DIR/.tmp/etl" "$CI_PROJECT_DIR/.tmp/pytest"
    - cd apps/backend
    - pytest tests -q --cov=app --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:"$BACKEND_REPORT_DIR/coverage.xml" --cov-report=html:"$BACKEND_REPORT_DIR/coverage-html" --junitxml="$BACKEND_REPORT_DIR/junit.xml"
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: reports/quality/backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/quality/backend/coverage.xml
    paths:
      - reports/quality/backend/junit.xml
      - reports/quality/backend/coverage.xml
      - reports/quality/backend/coverage-html/
    expire_in: 14 days

frontend:test:
  stage: test
  extends: .frontend_base
  script:
    - npm run coverage:frontend
    - cp reports/frontend-junit.xml "$FRONTEND_REPORT_DIR/junit.xml"
    - cp -R reports/frontend-coverage "$FRONTEND_REPORT_DIR/coverage-html"
  coverage: '/Statements\s+:\s+([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: reports/quality/frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/quality/frontend/coverage-html/cobertura-coverage.xml
    paths:
      - reports/quality/frontend/junit.xml
      - reports/quality/frontend/coverage-html/
    expire_in: 14 days

frontend:build:
  stage: build
  extends: .frontend_base
  needs:
    - frontend:eslint
    - frontend:typecheck
    - frontend:test
  script:
    - npm run build:frontend
  artifacts:
    paths:
      - apps/frontend/dist/
    expire_in: 14 days

backend:package:
  stage: package
  extends: .backend_base
  needs:
    - backend:ruff
    - backend:pylint
    - backend:test
  script:
    - python infra/ci/create_zip.py apps/backend reports/quality/backend/backend-package.zip --exclude "*.pyc" --exclude "*/__pycache__/*" --exclude "tests/*" --exclude ".venv/*" --exclude "data/*"
  artifacts:
    paths:
      - reports/quality/backend/backend-package.zip
    expire_in: 14 days

frontend:package:
  stage: package
  image: alpine:3.20
  extends: .rules_main_feat_mr
  needs:
    - job: frontend:build
      artifacts: true
  script:
    - mkdir -p "$CI_PROJECT_DIR/reports/quality/frontend"
    - cd apps/frontend/dist
    - tar -czf "$CI_PROJECT_DIR/reports/quality/frontend/frontend-dist.tar.gz" .
  artifacts:
    paths:
      - reports/quality/frontend/frontend-dist.tar.gz
    expire_in: 14 days

