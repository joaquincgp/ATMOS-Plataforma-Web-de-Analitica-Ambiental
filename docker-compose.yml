services:
  db:
    image: postgis/postgis:16-3.4
    container_name: atmos-db
    environment:
      POSTGRES_DB: atmos
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: atmos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - atmos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos -d atmos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    container_name: atmos-backend
    environment:
      APP_NAME: ATMOS API
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://atmos:atmos_dev_password@db:5432/atmos
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-udla.edu.ec}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      ACS_EMAIL_CONNECTION_STRING: ${ACS_EMAIL_CONNECTION_STRING:-}
      ACS_EMAIL_SENDER_ADDRESS: ${ACS_EMAIL_SENDER_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ATMOS}
      EMAIL_ATMOS_LOGO_URL: ${EMAIL_ATMOS_LOGO_URL:-}
      EMAIL_UDLA_LOGO_URL: ${EMAIL_UDLA_LOGO_URL:-}
      WORKSPACE_STORAGE_DIR: ./data/workspaces
      AUTO_INIT_DB_ON_STARTUP: "true"
      REMMAQ_PROXY_BASE_URL: ${REMMAQ_PROXY_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - atmos_workspace_data:/app/data/workspaces

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-udla.edu.ec}
    container_name: atmos-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  atmos_postgres_data:
  atmos_workspace_data:
