[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmos-backend"
version = "0.1.0"
description = "ATMOS backend API base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "beautifulsoup4>=4.12.3,<5.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "numpy>=2.2.3,<3.0.0",
  "pandas>=2.2.3,<3.0.0",
  "pyarrow>=19.0.1,<20.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "plotly>=6.0.1,<7.0.0",
  "xlrd>=2.0.1,<3.0.0",
  "rarfile>=4.2,<5.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "alembic>=1.15.1,<2.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "python-jose[cryptography]>=3.4.0,<4.0.0",
  "bcrypt>=4.2.1,<5.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "scipy>=1.13,<2.0.0",
  "statsmodels>=0.14,<1.0.0",
  "prophet>=1.1.5,<2.0.0",
  "python-dateutil>=2.9,<3.0",
  "torch>=2.3,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pylint>=3.3.0,<4.0.0",
  "ruff>=0.11.0,<1.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/db/init_db.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "../../reports/backend-coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv", "data"]
jobs = 0
persistent = false

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "broad-exception-caught",
  "duplicate-code",
  "fixme",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "import-outside-toplevel",
  "not-callable",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-lines",
  "too-many-instance-attributes",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-return-statements",
  "too-many-statements",
]
